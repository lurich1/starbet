    <circle cx="176" cy="176" r="1.8" opacity="0.7"/>
    <circle cx="150" cy="40" r="2" opacity="0.8"/>
    <circle cx="60" cy="150" r="1.6" opacity="0.6"/>
  </g>

  <!-- ball -->
  <circle cx="146" cy="74" r="52" fill="url(#ballShade)" stroke="#e2e8f0" stroke-width="1.5"/>
  <g fill="#0f172a">
    <path d="M146 44 l16 12 -6 19 h-20 l-6 -19 z"/>
    <path d="M110 66 l17 4 3 19 -15 12 -13 -13 z" opacity="0.92"/>
