<svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="streak" x1="0" y1="220" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8bc34a" stop-opacity="0"/>
      <stop offset="1" stop-color="#8bc34a"/>
    </linearGradient>
    <radialGradient id="ballShade" cx="0.35" cy="0.32" r="0.75">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d2da"/>
    </radialGradient>
  </defs>

  <!-- speed streak -->
  <path d="M8 196 C 70 176, 120 150, 176 74" stroke="url(#streak)" stroke-width="26" stroke-linecap="round" opacity="0.75"/>
  <path d="M20 208 C 78 190, 128 166, 190 92" stroke="url(#streak)" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <!-- sparkles -->
